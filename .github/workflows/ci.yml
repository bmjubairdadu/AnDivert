name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: Build & live-test engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK (for jni.h)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build + live tests
        run: bash tools/ci_build_and_test.sh

  android:
    name: Android build (all ABIs + AAR)
    # GitHub runners ship with the Android SDK + NDK preinstalled;
    # only JAVA_HOME setup is needed for Gradle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true

      - name: Build library (Gradle, CMake + NDK)
        run: ./gradlew :andivert:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: andivert-aar
          path: andivert/build/outputs/aar/*.aar
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [ test, android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release AAR
        run: ./gradlew :andivert:assembleRelease --no-daemon

      - name: Package raw release zip
        run: python tools/build_release.py || true

      - name: Collect artifacts
        run: |
          mkdir -p relout
          cp andivert/build/outputs/aar/andivert-release.aar relout/andivert-${GITHUB_REF_NAME#v}.aar
          if ls dist/andivert-*.zip >/dev/null 2>&1; then cp dist/andivert-*.zip relout/; fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: relout/*
          generate_release_notes: true
